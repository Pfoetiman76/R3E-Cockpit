name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install pyinstaller PySide6

      - name: Kernfunktionstests
        run: python test_core.py
      - name: Updater-Tests
        run: python test_updater.py

      - name: Version aus Tag ableiten
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: EXE bauen (Onedir, schneller Start ohne Entpack-Fenster)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name R3ECockpit main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller fehlgeschlagen (Exit $LASTEXITCODE)" }
          if (-not (Test-Path 'dist/R3ECockpit/R3ECockpit.exe')) { throw 'dist/R3ECockpit/R3ECockpit.exe fehlt' }

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          iscc installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer fehlgeschlagen (Exit $LASTEXITCODE)" }

      - name: Installer pruefen
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'installer/Output/R3ECockpit-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer fehlt in installer/Output' }
          if ($setup.Length -lt 5MB) { throw "Installer verdaechtig klein ($([math]::Round($setup.Length/1MB,1)) MB)" }
          Write-Host ("Installer OK: {0:N1} MB ({1})" -f ($setup.Length/1MB), $setup.Name)

      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/R3ECockpit-Setup-*.exe
          generate_release_notes: true
