name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install pyinstaller PySide6
      - name: Kernfunktionstests
        run: python test_core.py
      - name: EXE bauen
        run: pyinstaller --noconfirm --onefile --windowed --name R3ECockpit main.py
      - name: EXE pruefen
        run: |
          if (-Not (Test-Path "dist/R3ECockpit.exe")) { throw "dist/R3ECockpit.exe fehlt" }
          if ((Get-Item "dist/R3ECockpit.exe").Length -lt 1000000) { throw "EXE verdächtig klein" }
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --verify-tag "dist/R3ECockpit.exe#R3E Cockpit"
